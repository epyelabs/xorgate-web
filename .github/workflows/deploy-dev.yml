name: Web — deploy dev

# Builds xorgate-web and syncs dist/ to the dev website bucket (dev.xorgate.io)
# on every push to main. See deploy-prod.yml's header for the one-time AWS +
# GitHub setup; both workflows share the same machine-user secrets.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-deploy-dev
  cancel-in-progress: false # --delete syncs must not overlap

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: development # scopes vars.VITE_* to the dev environment
    env:
      BUCKET: dev.xorgate.io
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Write build env (.env)
        env:
          VITE_COGNITO_USER_POOL_ID: ${{ vars.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_COGNITO_IDENTITY_POOL_ID: ${{ vars.VITE_COGNITO_IDENTITY_POOL_ID }}
          VITE_AWS_REGION: ${{ vars.VITE_AWS_REGION }}
          VITE_IOT_ENDPOINT: ${{ vars.VITE_IOT_ENDPOINT }}
        run: |
          cat > .env <<EOF
          VITE_COGNITO_USER_POOL_ID=${VITE_COGNITO_USER_POOL_ID}
          VITE_COGNITO_CLIENT_ID=${VITE_COGNITO_CLIENT_ID}
          VITE_API_BASE_URL=${VITE_API_BASE_URL}
          VITE_COGNITO_IDENTITY_POOL_ID=${VITE_COGNITO_IDENTITY_POOL_ID}
          VITE_AWS_REGION=${VITE_AWS_REGION}
          VITE_IOT_ENDPOINT=${VITE_IOT_ENDPOINT}
          EOF

      - name: Build
        run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Sync dist/ to S3
        run: |
          # Vite content-hashes assets/* → immutable, cache forever.
          # --delete prunes files dropped since the last deploy.
          aws s3 sync dist/ "s3://$BUCKET" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          # index.html is the unhashed entrypoint — must always revalidate.
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" \
            --cache-control "no-cache"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Web dev deploy"
            echo ""
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Bucket: \`s3://$BUCKET\`"
          } >> "$GITHUB_STEP_SUMMARY"
