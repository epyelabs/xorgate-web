<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/xorgate-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xorgate - AI-Native IoT Infrastructure</title>
    <script>
      // Resolve the theme before first paint. The React ThemeProvider applies
      // the class in an effect, which is too late to stop a dark-mode refresh
      // from flashing white.
      try {
        var theme = localStorage.getItem("theme")
        if (
          theme === "dark" ||
          (theme !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark")
        }
      } catch (_) {
        /* no localStorage: fall through to light */
      }
    </script>
    <style>
      /* Boot splash, shown until React's first commit replaces #root. Styled
         inline because the app stylesheet only arrives with the JS bundle.
         Colors mirror --background / --primary in src/index.css, and the
         layout mirrors <AppLoadingScreen/> so the handoff is seamless. */
      html {
        background: #fff;
      }
      html.dark {
        background: #0a0a0a;
      }
      #boot-splash {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        padding: 1.5rem;
        color: #171717;
        font-family: 'Space Grotesk Variable', sans-serif;
      }
      html.dark #boot-splash {
        color: #e5e5e5;
      }
      #boot-splash .brand {
        display: flex;
        align-items: center;
        gap: 0.625rem;
      }
      #boot-splash .brand span {
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: -0.025em;
        color: #0a0a0a;
      }
      html.dark #boot-splash .brand span {
        color: #fafafa;
      }
      #boot-splash svg {
        width: 1.75rem;
        height: 1.75rem;
        animation: boot-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      #boot-splash .track {
        height: 2px;
        width: 11rem;
        overflow: hidden;
        border-radius: 9999px;
        background: #f5f5f5;
      }
      html.dark #boot-splash .track {
        background: #262626;
      }
      #boot-splash .bar {
        height: 100%;
        width: 33.333%;
        border-radius: 9999px;
        background: #171717;
        animation: boot-loading-bar 1.4s ease-in-out infinite;
      }
      html.dark #boot-splash .bar {
        background: #e5e5e5;
      }
      @keyframes boot-pulse {
        50% {
          opacity: 0.5;
        }
      }
      @keyframes boot-loading-bar {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(300%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <div class="brand">
          <!-- Same mark as <XorgateLogo/> -->
          <svg viewBox="0 0 93.5 70.87" xmlns="http://www.w3.org/2000/svg" fill="currentColor" aria-hidden="true">
            <g transform="scale(1.395)" fill-rule="nonzero">
              <path d="M34.34,17.91 L33.01,16.57 L16.55,0 L0,0 L23.01,23.16 C23.97,24.12 23.97,25.68 23.01,26.65 L0,49.8 L16.55,49.8 L33.01,33.23 L34.34,31.89 C38.18,28.02 38.18,21.78 34.34,17.91 Z" />
              <path d="M51.83,14.3 L66.02,0 L49.47,0 L35.28,14.3 C39.84,18.89 47.26,18.89 51.82,14.3 Z" />
              <path d="M35.28,35.5 L49.47,49.8 L66.02,49.8 L51.82,35.5 C47.26,30.91 39.84,30.91 35.28,35.5 Z" />
            </g>
          </svg>
          <span>xorgate</span>
        </div>
        <div class="track"><div class="bar"></div></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
