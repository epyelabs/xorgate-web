<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xorgate - AI-Native IoT Infrastructure</title>
    <script>
      // Resolve the theme before first paint. The React ThemeProvider applies
      // the class in an effect, which is too late to stop a dark-mode refresh
      // from flashing white.
      try {
        var theme = localStorage.getItem("theme")
        if (
          theme === "dark" ||
          (theme !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark")
        }
      } catch (_) {
        /* no localStorage: fall through to light */
      }
    </script>
    <style>
      /* Boot splash, shown until React's first commit replaces #root. Styled
         inline because the app stylesheet only arrives with the JS bundle.
         Colors mirror --background / --primary in src/index.css, and the
         layout mirrors <AppLoadingScreen/> so the handoff is seamless. */
      html {
        background: #fdfdfc;
      }
      html.dark {
        background: #0a0a0a;
      }
      #boot-splash {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        padding: 1.5rem;
        color: #171717;
        font-family: 'Figtree Variable', ui-sans-serif, system-ui, sans-serif;
      }
      html.dark #boot-splash {
        color: #e5e5e5;
      }
      #boot-splash .brand {
        display: flex;
        align-items: center;
        gap: 0.625rem;
      }
      #boot-splash svg {
        height: 1.75rem;
        width: auto;
        color: #ff3a00;
        animation: boot-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      #boot-splash .track {
        height: 2px;
        width: 11rem;
        overflow: hidden;
        border-radius: 9999px;
        background: #f1f0ed;
      }
      html.dark #boot-splash .track {
        background: #262626;
      }
      #boot-splash .bar {
        height: 100%;
        width: 33.333%;
        border-radius: 9999px;
        background: #171717;
        animation: boot-loading-bar 1.4s ease-in-out infinite;
      }
      html.dark #boot-splash .bar {
        background: #e5e5e5;
      }
      @keyframes boot-pulse {
        50% {
          opacity: 0.5;
        }
      }
      @keyframes boot-loading-bar {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(300%);
        }
      }
    </style>
  </head>
